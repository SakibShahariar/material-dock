name: Apply JavaScript formatting (one-time)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'style: format JavaScript with Prettier (#76)')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format JavaScript
        run: |
          npm install --global prettier@3.6.2
          prettier --write "**/*.js"
      - name: Commit formatting without rewriting history
        run: |
          if git diff --quiet; then
            echo "JavaScript already matches Prettier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.js'
          git commit -m "style: format JavaScript with Prettier (#76)"
          git push origin HEAD:main
