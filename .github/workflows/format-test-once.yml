name: Format folder sorting test (one-time)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'style: format folder sorting tests with Prettier (#85)')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format test
        run: |
          npm install --global prettier@3.6.2
          prettier --write tests/folder-sort.test.js
      - name: Commit formatting without rewriting history
        run: |
          if git diff --quiet; then
            echo "Test already matches Prettier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tests/folder-sort.test.js
          git commit -m "style: format folder sorting tests with Prettier (#85)"
          git push origin HEAD:main
