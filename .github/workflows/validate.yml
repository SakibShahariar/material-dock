name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes glib2.0-bin shellcheck

      - name: Validate extension metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(Path("metadata.json").read_text())
          required = ("name", "uuid", "description", "shell-version", "url", "version")
          missing = [key for key in required if key not in metadata]
          if missing:
              raise SystemExit(f"metadata.json is missing required keys: {', '.join(missing)}")
          if not isinstance(metadata["shell-version"], list) or not metadata["shell-version"]:
              raise SystemExit("metadata.json shell-version must be a non-empty array")
          print("metadata.json is valid")
          PY

      - name: Check JavaScript syntax
        run: |
          while IFS= read -r file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' | sort)

      - name: Reject unsupported JavaScript APIs
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          pattern = re.compile(r"\bMath\s*\.\s*clamp\s*\(")
          matches = []
          for path in Path(".").rglob("*.js"):
              if ".git" in path.parts or "node_modules" in path.parts:
                  continue
              for number, line in enumerate(path.read_text().splitlines(), 1):
                  if pattern.search(line):
                      matches.append(f"{path}:{number}: {line.strip()}")

          if matches:
              raise SystemExit(
                  "Math.clamp is unavailable in supported GNOME Shell runtimes; "
                  "use Math.max/Math.min instead:\n" + "\n".join(matches)
              )
          print("No unsupported Math.clamp calls found")
          PY

      - name: Run JavaScript unit tests
        run: node --test tests/*.test.js

      - name: Validate GSettings schema
        run: |
          glib-compile-schemas --strict --dry-run schemas
          glib-compile-schemas schemas
          test -f schemas/gschemas.compiled
          rm schemas/gschemas.compiled

      - name: Check settings references against schema
        run: |
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          schema_path = Path("schemas/org.gnome.shell.extensions.material-dock.gschema.xml")
          root = ET.parse(schema_path).getroot()
          declared = {key.attrib["name"] for key in root.findall(".//key")}
          pattern = re.compile(r"""\bsettings\.(?:get|set)_(?:boolean|double|int|string|strv)\(\s*['"]([^'"]+)['"]""")
          references = {}
          for path in [Path("extension.js"), Path("prefs.js"), *Path("lib").rglob("*.js")]:
              source = path.read_text()
              for key in pattern.findall(source):
                  references.setdefault(key, set()).add(str(path))

          missing = sorted(set(references) - declared)
          if missing:
              details = ", ".join(f"{key} ({', '.join(sorted(references[key]))})" for key in missing)
              raise SystemExit(f"Settings referenced in JavaScript but missing from schema: {details}")
          print(f"Validated {len(references)} literal GSettings keys against schema")
          PY

      - name: Check installer shell syntax
        run: bash -n install.sh

      - name: Run ShellCheck on installer
        run: shellcheck install.sh
