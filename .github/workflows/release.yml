name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package-and-publish:
    name: Package extension and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes glib2.0-bin zip

      - name: Validate tag and metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit(f"Expected a semantic version tag like v1.0.0, got {tag!r}")
          metadata = json.loads(Path("metadata.json").read_text())
          required = ("name", "uuid", "description", "shell-version", "url", "version")
          missing = [key for key in required if key not in metadata]
          if missing:
              raise SystemExit(f"metadata.json is missing: {', '.join(missing)}")
          if not metadata["shell-version"]:
              raise SystemExit("metadata.json must declare at least one Shell version")
          print(f"Preparing {metadata['name']} release {tag}")
          PY

      - name: Build extension archive and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          UUID="material-dock@SakibShahariar"
          STAGE="$RUNNER_TEMP/package/$UUID"
          mkdir -p "$STAGE/schemas" "$STAGE/lib"
          cp metadata.json extension.js prefs.js stylesheet.css "$STAGE/"
          cp schemas/*.xml "$STAGE/schemas/"
          cp lib/*.js "$STAGE/lib/"
          glib-compile-schemas "$STAGE/schemas"
          mkdir -p dist
          ARCHIVE="dist/material-dock-${RELEASE_TAG}.zip"
          (cd "$RUNNER_TEMP/package" && zip -qr "$GITHUB_WORKSPACE/$ARCHIVE" "$UUID")
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          unzip -l "$ARCHIVE"
          sha256sum -c "$ARCHIVE.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "dist/material-dock-${RELEASE_TAG}.zip" \
            "dist/material-dock-${RELEASE_TAG}.zip.sha256" \
            --title "Material Dock ${RELEASE_TAG}" \
            --notes-file CHANGELOG.md
